# PatchSteps-StagingMiddleTier4.yml — per-host pre-patch checks + patch/reboot tracking
# Inventory source of truth for roles: StagingMiddleTier.yml
#
# Learning tips:
# - Use Y or N for *YN fields (or null if not checked yet).
# - Use a number for GigsAvail-* (free GB), or null until measured.
# - Use ISO-8601 strings for *ISO8601 (e.g. 2026-04-02T14:30:00-05:00) or null.
# - F5 rows use hostname as a logical label; there is no Windows C: drive — leave drive fields null or 0.

